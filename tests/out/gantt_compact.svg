<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="1008" height="146" viewBox="-4 -4 1008 146" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:lightgrey;opacity:.8;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .exr{fill:#eee;stroke:none;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:navy;stroke-width:4px;}#mermaid .vtx{fill:navy;font-size:11px;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="-4" y="-4" width="1008" height="146" fill="white"/><rect class="sec0" x="0" y="48" width="1000" height="48"/><text class="stitle" x="10" y="72" text-anchor="start" dominant-baseline="central">Section</text><line class="grid" x1="131.67" y1="48" x2="131.67" y2="96"/><text class="tick" x="131.67" y="110" text-anchor="middle" dominant-baseline="central">2014-01-05</text><line class="grid" x1="230.83" y1="48" x2="230.83" y2="96"/><text class="tick" x="230.83" y="110" text-anchor="middle" dominant-baseline="central">2014-01-12</text><line class="grid" x1="330" y1="48" x2="330" y2="96"/><text class="tick" x="330" y="110" text-anchor="middle" dominant-baseline="central">2014-01-19</text><line class="grid" x1="429.17" y1="48" x2="429.17" y2="96"/><text class="tick" x="429.17" y="110" text-anchor="middle" dominant-baseline="central">2014-01-26</text><line class="grid" x1="528.33" y1="48" x2="528.33" y2="96"/><text class="tick" x="528.33" y="110" text-anchor="middle" dominant-baseline="central">2014-02-02</text><line class="grid" x1="627.5" y1="48" x2="627.5" y2="96"/><text class="tick" x="627.5" y="110" text-anchor="middle" dominant-baseline="central">2014-02-09</text><line class="grid" x1="726.67" y1="48" x2="726.67" y2="96"/><text class="tick" x="726.67" y="110" text-anchor="middle" dominant-baseline="central">2014-02-16</text><line class="grid" x1="825.83" y1="48" x2="825.83" y2="96"/><text class="tick" x="825.83" y="110" text-anchor="middle" dominant-baseline="central">2014-02-23</text><line class="grid" x1="925" y1="48" x2="925" y2="96"/><text class="tick" x="925" y="110" text-anchor="middle" dominant-baseline="central">2014-03-02</text><rect class="task" x="75" y="50" width="425" height="20" rx="3"/><text class="tin" x="287.5" y="60" text-anchor="middle" dominant-baseline="central">A task</text><rect class="task" x="344.17" y="74" width="354.17" height="20" rx="3"/><text class="tin" x="521.25" y="84" text-anchor="middle" dominant-baseline="central">Another task</text><rect class="task" x="641.67" y="50" width="283.33" height="20" rx="3"/><text class="tin" x="783.33" y="60" text-anchor="middle" dominant-baseline="central">Another one</text><text class="ttl" x="500" y="25" text-anchor="middle" dominant-baseline="central">A Gantt Diagram</text></svg>
