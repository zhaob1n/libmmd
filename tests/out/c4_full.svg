s="cn" x="669" y="1026.8" text-anchor="middle" dominant-baseline="central">Database</text><text class="cs" x="669" y="1047.2" text-anchor="middle" dominant-baseline="central">[Container: SQL Database]</text><text class="cd" x="669" y="1069.2" text-anchor="middle" dominant-baseline="central">Stores user registration</text><text class="cd" x="669" y="1090.2" text-anchor="middle" dominant-baseline="central">information, hashed auth</text><text class="cd" x="669" y="1111.2" text-anchor="middle" dominant-baseline="central">credentials, access logs, etc.</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M210,1225.2h196a10,31.4 0 0 1 0,62.8h-196a10,31.4 0 0 1 0,-62.8z M406,1225.2a10,31.4 0 0 0 0,62.8"/><text class="cn" x="308" y="1247.6" text-anchor="middle" dominant-baseline="central">Events</text><text class="cs" x="308" y="1268" text-anchor="middle" dominant-baseline="central">[Container: Kafka]</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#999999" stroke="#8A8A8A" x="150" y="428.8" width="225.64" height="104.8"/><text class="cn" x="262.82" y="451.2" text-anchor="middle" dominant-baseline="central">Mainframe Banking System</text><text class="cs" x="262.82" y="471.6" text-anchor="middle" dominant-baseline="central">[Software System]</text><text class="cd" x="262.82" y="495.1" text-anchor="middle" dominant-baseline="central">Stores all of the core banking</text><text class="cd" x="262.82" y="516.1" text-anchor="middle" dominant-baseline="central">information.</text></g></svg>
