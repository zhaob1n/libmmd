<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="c4" width="990.93" height="1369.68" viewBox="-12 -46 990.93 1369.68" role="graphics-document document" aria-roledescription="c4"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .ct{fill:#fff;}#mermaid .ct.ext{fill:#fff;}#mermaid .cn{font-weight:bold;font-size:14px;}#mermaid .cs{font-size:10.5px;}#mermaid .cd{font-size:11.48px;}#mermaid .cb{fill:none;stroke:#444;stroke-width:1px;stroke-dasharray:7,7;}#mermaid .cbt{font-weight:bold;font-size:14px;fill:#444;}#mermaid .cbs{font-size:12px;fill:#444;}#mermaid .cr{fill:none;stroke:#444;stroke-width:1px;}#mermaid .crh{fill:#444;}#mermaid .crl{font-size:13px;fill:#444;}#mermaid .crt{font-size:12px;font-style:italic;fill:#444;}#mermaid .crx{fill:inherit;}#mermaid .crc .cr{stroke:inherit;}#mermaid .crc .crh{fill:inherit;}</style><rect x="-12" y="-46" width="990.93" height="1369.68" fill="white"/><text class="cn" x="483.46" y="-20" text-anchor="middle" dominant-baseline="central">Container diagram for Internet Banking System</text><rect class="cb" x="150" y="689.71" width="666.93" height="511.97" rx="2.5"/><text class="cbt" x="483.46" y="703.71" text-anchor="middle" dominant-baseline="central">Internet Banking</text><text class="cbs" x="483.46" y="719.71" text-anchor="middle" dominant-baseline="central">[Container]</text><path class="cr" d="M270.11,369.22L307.15,789.71"/><path class="crh" d="M307.15,789.71L302.29,780.1L310.26,779.39z"/><text class="crl" x="291.6" y="605.1" text-anchor="middle" dominant-baseline="central">Uses</text><text class="crt" x="291.6" y="621.1" text-anchor="middle" dominant-baseline="central">[HTTPS]</text><path class="cr" d="M424.8,847.13L524.8,845.24"/><path class="crh" d="M524.8,845.24L514.88,849.43L514.73,841.43z"/><text class="crl" x="474.8" y="838.19" text-anchor="middle" dominant-baseline="central">Uses</text><text class="crt" x="474.8" y="854.19" text-anchor="middle" dominant-baseline="central">[async, JSON/HTTPS]</text><path class="cr" d="M570.06,896.19L409.7,1008.82"/><path class="crh" d="M409.7,1008.82L415.59,999.79L420.18,1006.34z"/><text class="crl" x="489.88" y="944.5" text-anchor="middle" dominant-baseline="central">Reads from and writes to</text><text class="crt" x="489.88" y="960.5" text-anchor="middle" dominant-baseline="central">[sync, JDBC]</text><path class="cr" d="M639.74,896.19L626.77,1008.82"/><path class="crh" d="M626.77,1008.82L623.94,998.42L631.89,999.34z"/><text class="crl" x="633.25" y="952.5" text-anchor="middle" dominant-baseline="central">Publishes</text><path class="cr" d="M473.03,242.24L373.03,256.13"/><path class="crh" d="M373.03,256.13L382.38,250.79L383.48,258.71z"/><text class="crl" x="423.03" y="249.18" text-anchor="middle" dominant-baseline="central">Sends e-mails to</text><path class="cr" d="M581.74,789.71L324,575.71"/><path class="crh" d="M324,575.71L334.25,579.02L329.14,585.17z"/><path class="crh" d="M581.74,789.71L571.49,786.4L576.6,780.24z"/><text class="crl" x="452.87" y="674.71" text-anchor="middle" dominant-baseline="central">Uses</text><text class="crt" x="452.87" y="690.71" text-anchor="middle" dominant-baseline="central">[XML/HTTPS]</text><g class="c4-element" fill="#fff"><rect fill="#08427B" stroke="#073B6F" rx="39.48" x="150" y="262.74" width="223.03" height="106.48"/><circle fill="#08427B" stroke="#073B6F" cx="261.51" cy="225.3" r="51.3"/><text class="cn" x="261.51" y="292.05" text-anchor="middle" dominant-baseline="central">Personal Banking Customer</text><text class="cs" x="261.51" y="315.02" text-anchor="middle" dominant-baseline="central">[Person]</text><text class="cd" x="261.51" y="328.96" text-anchor="middle" dominant-baseline="central">A customer of the bank, with</text><text class="cd" x="261.51" y="341.59" text-anchor="middle" dominant-baseline="central">personal bank accounts.</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#999999" stroke="#8A8A8A" x="473.03" y="174" width="216" height="106.48"/><text class="cn" x="581.03" y="203.31" text-anchor="middle" dominant-baseline="central">E-Mail System</text><text class="cs" x="581.03" y="226.28" text-anchor="middle" dominant-baseline="central">[Software System]</text><text class="cd" x="581.03" y="240.22" text-anchor="middle" dominant-baseline="central">The internal Microsoft Exchange</text><text class="cd" x="581.03" y="252.85" text-anchor="middle" dominant-baseline="central">system</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="200" y="789.71" width="224.8" height="119.11"/><text class="cn" x="312.4" y="819.02" text-anchor="middle" dominant-baseline="central">Single-Page App</text><text class="cs" x="312.4" y="841.98" text-anchor="middle" dominant-baseline="central">[Container: JavaScript, Angular]</text><text class="cd" x="312.4" y="855.92" text-anchor="middle" dominant-baseline="central">Provides all the Internet banking</text><text class="cd" x="312.4" y="868.55" text-anchor="middle" dominant-baseline="central">functionality to customers via their</text><text class="cd" x="312.4" y="881.18" text-anchor="middle" dominant-baseline="central">web browser</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="524.8" y="789.71" width="242.13" height="106.48"/><text class="cn" x="645.86" y="819.02" text-anchor="middle" dominant-baseline="central">API Application</text><text class="cs" x="645.86" y="841.98" text-anchor="middle" dominant-baseline="central">[Container: Java, Docker Container]</text><text class="cd" x="645.86" y="855.92" text-anchor="middle" dominant-baseline="central">Provides Internet banking functionality</text><text class="cd" x="645.86" y="868.55" text-anchor="middle" dominant-baseline="central">via API</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M200,1024.65a108,15.84 0 0 1 216,0v111.19a108,15.84 0 0 1 -216,0z M200,1024.65a108,15.84 0 0 0 216,0"/><text class="cn" x="308" y="1061.88" text-anchor="middle" dominant-baseline="central">Database</text><text class="cs" x="308" y="1084.85" text-anchor="middle" dominant-baseline="central">[Container: SQL Database]</text><text class="cd" x="308" y="1098.79" text-anchor="middle" dominant-baseline="central">Stores user registration</text><text class="cd" x="308" y="1111.42" text-anchor="middle" dominant-baseline="central">information, hashed auth</text><text class="cd" x="308" y="1124.04" text-anchor="middle" dominant-baseline="central">credentials, access logs, etc.</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M522.96,1008.82h202.08a6.96,24.11 0 0 1 0,48.22h-202.08a6.96,24.11 0 0 1 0,-48.22z M725.04,1008.82a6.96,24.11 0 0 0 0,48.22"/><text class="cn" x="624" y="1024.44" text-anchor="middle" dominant-baseline="central">Events</text><text class="cs" x="624" y="1047.41" text-anchor="middle" dominant-baseline="central">[Container: Kafka]</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#999999" stroke="#8A8A8A" x="150" y="469.22" width="219.75" height="106.48"/><text class="cn" x="259.87" y="498.53" text-anchor="middle" dominant-baseline="central">Mainframe Banking System</text><text class="cs" x="259.87" y="521.5" text-anchor="middle" dominant-baseline="central">[Software System]</text><text class="cd" x="259.87" y="535.44" text-anchor="middle" dominant-baseline="central">Stores all of the core banking</text><text class="cd" x="259.87" y="548.07" text-anchor="middle" dominant-baseline="central">information.</text></g></svg>
