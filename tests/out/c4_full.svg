ral" x="427.18" y="16">&lt;&lt;external_system&gt;&gt;</text><text class="cn" x="427.18" y="36.4" text-anchor="middle" dominant-baseline="central">E-Mail System</text><text class="cd" x="427.18" y="64.3" text-anchor="middle" dominant-baseline="central">The internal Microsoft</text><text class="cd" x="427.18" y="85.3" text-anchor="middle" dominant-baseline="central">Exchange system</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="20" y="292.8" width="216" height="162.8"/><text class="cs" text-anchor="middle" dominant-baseline="central" x="128" y="308.8">&lt;&lt;container&gt;&gt;</text><text class="cn" x="128" y="329.2" text-anchor="middle" dominant-baseline="central">Single-Page App</text><text class="cs" x="128" y="351.6" text-anchor="middle" dominant-baseline="central">[JavaScript, Angular]</text><text class="cd" x="128" y="372.1" text-anchor="middle" dominant-baseline="central">Provides all the Internet</text><text class="cd" x="128" y="393.1" text-anchor="middle" dominant-baseline="central">banking functionality to</text><text class="cd" x="128" y="414.1" text-anchor="middle" dominant-baseline="central">customers via their web</text><text class="cd" x="128" y="435.1" text-anchor="middle" dominant-baseline="central">browser</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="326" y="292.8" width="216" height="126.8"/><text class="cs" text-anchor="middle" dominant-baseline="central" x="434" y="308.8">&lt;&lt;container&gt;&gt;</text><text class="cn" x="434" y="329.2" text-anchor="middle" dominant-baseline="central">API Application</text><text class="cs" x="434" y="351.6" text-anchor="middle" dominant-baseline="central">[Java, Docker Container]</text><text class="cd" x="434" y="375.1" text-anchor="middle" dominant-baseline="central">Provides Internet banking</text><text class="cd" x="434" y="396.1" text-anchor="middle" dominant-baseline="central">functionality via API</text></g><g 