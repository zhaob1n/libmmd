.18" y="42.8" text-anchor="middle" dominant-baseline="central">[Software System]</text><text class="cd" x="427.18" y="66.3" text-anchor="middle" dominant-baseline="central">The internal Microsoft</text><text class="cd" x="427.18" y="87.3" text-anchor="middle" dominant-baseline="central">Exchange system</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="20" y="290.8" width="241.2" height="140.8"/><text class="cn" x="140.6" y="313.2" text-anchor="middle" dominant-baseline="central">Single-Page App</text><text class="cs" x="140.6" y="333.6" text-anchor="middle" dominant-baseline="central">[Container: JavaScript, Angular]</text><text class="cd" x="140.6" y="354.1" text-anchor="middle" dominant-baseline="central">Provides all the Internet</text><text class="cd" x="140.6" y="375.1" text-anchor="middle" dominant-baseline="central">banking functionality to</text><text class="cd" x="140.6" y="396.1" text-anchor="middle" dominant-baseline="central">customers via their web</text><text class="cd" x="140.6" y="417.1" text-anchor="middle" dominant-baseline="central">browser</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="351.2" y="290.8" width="261" height="104.8"/><text class="cn" x="481.7" y="313.2" text-anchor="middle" dominant-baseline="central">API Application</text><text class="cs" x="481.7" y="333.6" text-anchor="middle" dominant-baseline="central">[Container: Java, Docker Container]</text><text class="cd" x="481.7" y="357.1" text-anchor="middle" dominant-baseline="central">Provides Internet banking</text><text class="cd" x="481.7" y="378.1" text-anchor="middle" dominant-baseline="central">functionality via API</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M702.2,300.8a108,10 0 0 1 216,0v116.8a108,10 0 0 1 -216,0z M702.2,300.8a108,10 0 0 0 216,0"/><text class="cn" x="810.2" y="329.2" text-anchor="middle" dominant-baseline="central">Database</text>