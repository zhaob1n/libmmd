"middle" dominant-baseline="central">functionality via API</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M35,988.2a108,10 0 0 1 216,0v138.8a108,10 0 0 1 -216,0z M35,988.2a108,10 0 0 0 216,0"/><text class="cs" text-anchor="middle" dominant-baseline="central" x="143" y="1010.2">&lt;&lt;container&gt;&gt;</text><text class="cn" x="143" y="1030.6" text-anchor="middle" dominant-baseline="central">Database</text><text class="cs" x="143" y="1053" text-anchor="middle" dominant-baseline="central">[SQL Database]</text><text class="cd" x="143" y="1075" text-anchor="middle" dominant-baseline="central">Stores user registration</text><text class="cd" x="143" y="1096" text-anchor="middle" dominant-baseline="central">information, hashed auth</text><text class="cd" x="143" y="1117" text-anchor="middle" dominant-baseline="central">credentials, access logs, etc.</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M311,1015.2h196a10,42.4 0 0 1 0,84.8h-196a10,42.4 0 0 1 0,-84.8z M507,1015.2a10,42.4 0 0 0 0,84.8"/><text class="cs" text-anchor="middle" dominant-baseline="central" x="409" y="1031.2">&lt;&lt;container&gt;&gt;</text><text class="cn" x="409" y="1051.6" text-anchor="middle" dominant-baseline="central">Events</text><text class="cs" x="409" y="1074" text-anchor="middle" dominant-baseline="central">[Kafka]</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#999999" stroke="#8A8A8A" x="602" y="1003.2" width="225.62" height="108.8"/><text class="cs" text-anchor="middle" dominant-baseline="central" x="714.81" y="1019.2">&lt;&lt;external_system&gt;&gt;</text><text class="cn" x="714.81" y="1039.6" text-anchor="middle" dominant-baseline="central">Mainframe Banking System</text><text class="cd" x="714.81" y="1067.5" text-anchor="middle" dominant-baseline="central">Stores all of the core banking</text><text class="cd" x="714.81" y="1088.5" text-anchor="middle" dominant-baseline="central">information.</te