<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="1008" height="170" viewBox="-4 -4 1008 170" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:lightgrey;opacity:.8;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .exr{fill:#eee;stroke:none;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:#ff8888;stroke-width:2px;stroke-dasharray:4 2;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="-4" y="-4" width="1008" height="170" fill="white"/><rect class="sec0" x="0" y="48" width="1000" height="72"/><text class="stitle" x="10" y="84" text-anchor="start" dominant-baseline="central">Ops</text><rect class="exr" x="132.16" y="48" width="119.3" height="72"/><rect class="exr" x="549.71" y="48" width="119.3" height="72"/><line class="grid" x1="191.81" y1="48" x2="191.81" y2="120"/><text class="tick" x="191.81" y="134" text-anchor="middle" dominant-baseline="central">10-03 00:00</text><line class="grid" x1="311.11" y1="48" x2="311.11" y2="120"/><text class="tick" x="311.11" y="134" text-anchor="middle" dominant-baseline="central">10-05 00:00</text><line class="grid" x1="430.41" y1="48" x2="430.41" y2="120"/><text class="tick" x="430.41" y="134" text-anchor="middle" dominant-baseline="central">10-