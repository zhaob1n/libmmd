<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="kanban" width="1262" height="304" viewBox="-6 -6 1262 304" role="graphics-document document" aria-roledescription="kanban"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .kc{stroke:#9370DB;stroke-width:1px;}#mermaid .kt{font-size:16px;fill:#333;font-weight:bold;}#mermaid .ki{fill:#fff;stroke:#9370DB;stroke-width:1px;}#mermaid .kl{font-size:14px;fill:#333;}#mermaid .km{font-size:12px;fill:#666;}#mermaid .kp{stroke-width:4px;}</style><rect x="-6" y="-6" width="1262" height="304" fill="white"/><rect class="kc" x="0" y="0" width="200" height="292" rx="5" fill="#ECECFF"/><text class="kt" x="100" y="25" text-anchor="middle" dominant-baseline="central">Todo</text><rect class="kc" x="210" y="0" width="200" height="292" rx="5" fill="#ffffde"/><text class="kt" x="310" y="25" text-anchor="middle" dominant-baseline="central">In progress</text><rect class="kc" x="420" y="0" width="200" height="292" rx="5" fill="#e8f4ea"/><text class="kt" x="520" y="25" text-anchor="middle" dominant-baseline="central">Ready for deploy</text><rect class="kc" x="630" y="0" width="200" height="292" rx="5" fill="#fde8e8"/><text class="kt" x="730" y="25" text-anchor="middle" dominant-baseline="central">Ready for test</text><rect class="kc" x="840" y="0" width="200" height="292" rx="5" fill="#e8f0fd"/><text class="kt" x="940" y="25" text-anchor="middle" dominant-baseline="central">Done</text><rect class="kc" x="1050" y="0" width="200" height="292" rx="5" fill="#f8e8fd"/><text class="kt" x="1150" y="25" text-anchor="middle" dominant-baseline="central">Can't reproduce</text><rect class="ki" x="10" y="50" width="180" height="36" rx="5"/><text class="kl" x="20" y="68" text-anchor="start" dominant-baseline="central">Create Documentation</text><rect class="ki" x="10" y="94" width="180" height="56" rx="5"/><text class="kl" x="20" y="111.5" text-anchor="start" dominant-baseline="central">Create Blog about the</text><text class="kl" x="20" y="132.5" text-anchor="start" dominant-baseline="central">new diagram</text><rect class="ki" x="220" y="50" width="180" height="116" rx="5"/><text class="kl" x="230" y="66" text-anchor="start" dominant-baseline="central">Create renderer so</text><text class="kl" x="230" y="87" text-anchor="start" dominant-baseline="central">that it works in all</text><text class="kl" x="230" y="108" text-anchor="start" dominant-baseline="central">cases. We also add</text><text class="kl" x="230" y="129" text-anchor="start" dominant-baseline="central">some extra text here</text><text class="kl" x="230" y="150" text-anchor="start" dominant-baseline="central">for testing purposes.</text><rect class="ki" x="430" y="50" width="180" height="56" rx="5"/><text class="kl" x="440" y="68" text-anchor="start" dominant-baseline="central">Design grammar</text><text class="km" x="602" y="92" text-anchor="end" dominant-baseline="central">knsv</text><rect class="ki" x="640" y="50" width="180" height="56" rx="5"/><line class="kp" stroke="orange" x1="642" y1="53" x2="642" y2="103"/><text class="kl" x="650" y="68" text-anchor="start" dominant-baseline="central">Create parsing tests</text><text class="km" x="650" y="92" text-anchor="start" dominant-baseline="central">MC-2038</text><text class="km" x="812" y="92" text-anchor="end" dominant-baseline="central">K.Sveidqvist</text><rect class="ki" x="640" y="114" width="180" height="56" rx="5"/><line class="kp" stroke="lightblue" x1="642" y1="117" x2="642" y2="167"/><text class="kl" x="650" y="132" text-anchor="start" dominant-baseline="central">last item</text><text class="km" x="812" y="156" text-anchor="end" dominant-baseline="central">knsv</text><rect class="ki" x="850" y="50" width="180" height="36" rx="5"/><text class="kl" x="860" y="68" text-anchor="start" dominant-baseline="central">define getData</text><rect class="ki" x="850" y="94" width="180" height="116" rx="5"/><line class="kp" stroke="red" x1="852" y1="97" x2="852" y2="207"/><text class="kl" x="860" y="110.5" text-anchor="start" dominant-baseline="central">Title of diagram is</text><text class="kl" x="860" y="131.5" text-anchor="start" dominant-baseline="central">more than 100 chars</text><text class="kl" x="860" y="152.5" text-anchor="start" dominant-baseline="central">when user duplicates</text><text class="kl" x="860" y="173.5" text-anchor="start" dominant-baseline="central">diagram with 100 char</text><text class="km" x="860" y="196" text-anchor="start" dominant-baseline="central">MC-2036</text><rect class="ki" x="850" y="218" width="180" height="56" rx="5"/><line class="kp" stroke="orange" x1="852" y1="221" x2="852" y2="271"/><text class="kl" x="860" y="236" text-anchor="start" dominant-baseline="central">Update DB function</text><text class="km" x="860" y="260" text-anchor="start" dominant-baseline="central">MC-2037</text><text class="km" x="1022" y="260" text-anchor="end" dominant-baseline="central">knsv</text><rect class="ki" x="1060" y="50" width="180" height="56" rx="5"/><text class="kl" x="1070" y="67.5" text-anchor="start" dominant-baseline="central">Weird flickering in</text><text class="kl" x="1070" y="88.5" text-anchor="start" dominant-baseline="central">Firefox</text></svg>
