<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="sequence" width="390" height="330" viewBox="-20 -10 390 330" role="graphics-document document" aria-roledescription="sequence"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid .actor{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .actor-man circle,#mermaid .actor-line{fill:#ECECFF;stroke:#9370DB;stroke-width:2px;}#mermaid text{fill:#333;}#mermaid .lifeline{stroke:#999;stroke-width:0.5px;}#mermaid .msg{stroke:#333;stroke-width:1.5px;fill:none;}#mermaid .msg.dotted{stroke-dasharray:3,3;}#mermaid .note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#mermaid .act{fill:#f4f4f4;stroke:#666;stroke-width:1px;}#mermaid .block{fill:none;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-sep{stroke:#526e9c;stroke-width:1.5px;stroke-dasharray:3,3;}#mermaid .block-tab{fill:#ECECFF;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-kw{font-size:14px;font-weight:bold;}#mermaid .seqnum{fill:#333;}#mermaid .seqnum-t{fill:#fff;font-size:12px;}#mermaid .title{font-size:18px;}#mermaid .box{stroke:rgba(0,0,0,0.5);stroke-width:1px;}#mermaid .destroy{stroke:#333;stroke-width:2px;fill:none;}</style><defs><marker id="sq-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#333"/></marker><marker id="sq-arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#333"/></marker><marker id="sq-cross" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,10 M10,2 L2,10" stroke="#333" stroke-width="2"/></marker><marker id="sq-async" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs><rect x="-20" y="-10" width="390" height="330" fill="white"/><line class="lifeline" x1="75" y1="65" x2="75" y2="245"/><rect class="actor" x="0" y="0" width="150" height="65"/><text class="actor-label" x="75" y="32.5" text-anchor="middle" dominant-baseline="central">Alice</text><line class="lifeline" x1="275" y1="65" x2="275" y2="245"/><rect class="actor" x="200" y="0" width="150" height="65"/><text class="actor-label" x="275" y="32.5" text-anchor="middle" dominant-baseline="central">John</text><text class="msg-text" x="175" y="97" text-anchor="middle" dominant-baseline="central">Hello John</text><path class="msg" d="M75,113 L274,113" marker-end="url(#sq-arrow)"/><circle class="seqdot" cx="275" cy="113" r="5" fill="#333"/><text class="msg-text" x="175" y="147" text-anchor="middle" dominant-baseline="central">How are you?</text><path class="msg" d="M75,163 L274,163" marker-end="url(#sq-arrow)"/><circle class="seqdot" cx="75" cy="163" r="5" fill="#333"/><text class="msg-text" x="175" y="197" text-anchor="middle" dominant-baseline="central">Great!</text><path class="msg" d="M275,213 L76,213" marker-end="url(#sq-arrow)"/><circle class="seqdot" cx="275" cy="213" r="5" fill="#333"/><circle class="seqdot" cx="75" cy="213" r="5" fill="#333"/><rect class="actor" x="0" y="245" width="150" height="65"/><text class="actor-label" x="75" y="277.5" text-anchor="middle" dominant-baseline="central">Alice</text><rect class="actor" x="200" y="245" width="150" height="65"/><text class="actor-label" x="275" y="277.5" text-anchor="middle" dominant-baseline="central">John</text></svg>
