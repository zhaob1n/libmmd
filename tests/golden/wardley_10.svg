<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="wardley" width="900" height="600" viewBox="0 0 900 600" role="graphics-document document" aria-roledescription="wardley"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid .wardley-background{fill:white;}#mermaid .wardley-halo{stroke:white;}#mermaid text{fill:#131300;}#mermaid .wardley-node-label{fill:#131300;}#mermaid .wardley-annotation text,#mermaid .wardley-annotations-box text{fill:#131300;}#mermaid .wardley-axes line,#mermaid .wardley-stages line,#mermaid .wardley-pipeline-box{stroke:#333333;}#mermaid .wardley-link,#mermaid .wardley-pipeline-evolution-link{stroke:#333333;}#mermaid .wardley-link-arrow{fill:#333333;}#mermaid .wardley-trend{stroke:#dc3545;}#mermaid .wardley-trend-arrow{fill:#dc3545;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot{fill:white;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot,#mermaid .wardley-buy-overlay,#mermaid .wardley-outsource-overlay,#mermaid .wardley-market-line,#mermaid .wardley-inertia,#mermaid .wardley-accelerator{stroke:#333333;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{fill:white;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{stroke:#333333;}</style><rect x="0" y="0" width="900" height="600" fill="white"/><g class="wardley-map"><rect class="wardley-background" width="900" height="600"/><text x="450" y="24" class="wardley-title" font-size="12.6" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Evolution</text><g class="wardley-axes"><line x1="48" y1="552" x2="852" y2="552" stroke-width="1"/><line x1="48" y1="48" x2="48" y2="552" stroke-width="1"/><text x="450" y="588" class="wardley-axis-label" font-size="12" font-weight="bold" text-anchor="middle">Evolution</text><text class="wardley-axis-label" x="16" y="300" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 16 300)">Visibility</text></g><g class="wardley-stages"><text x="148.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Genesis</text><line x1="249" y1="48" x2="249" y2="552" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="349.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Custom Built</text><line x1="450" y1="48" x2="450" y2="552" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="550.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Product</text><line x1="651" y1="48" x2="651" y2="552" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="751.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Commodity</text></g><g class="wardley-links"><line class="wardley-link" x1="454.37" y1="346.29" x2="526.03" y2="278.91" stroke-width="1"/></g><g class="wardley-trends"><line x1="450" y1="350.4" x2="643" y2="350.4" class="wardley-trend" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#mermaid-arrow)"/><line x1="530.4" y1="274.8" x2="683.2" y2="274.8" class="wardley-trend" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#mermaid-arrow)"/></g><g class="wardley-nodes"><g class="wardley-node wardley-node--component"><circle cx="450" cy="350.4" r="6" class="wardley-component" stroke-width="1"/><text x="399.19" y="342.4" class="wardley-node-label" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">Database</text></g><g class="wardley-node wardley-node--component"><circle cx="530.4" cy="274.8" r="6" class="wardley-component" stroke-width="1"/><text x="538.4" y="266.8" class="wardley-node-label" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">API</text></g></g></g><defs><marker id="mermaid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wardley-trend-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 10 0 L 0 5 L 10 10 z" stroke="none"/></marker></defs></svg>
