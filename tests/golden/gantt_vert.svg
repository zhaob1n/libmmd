<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="784" height="148" viewBox="0 0 784 148" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:lightgrey;opacity:.8;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .exr{fill:#eee;stroke:none;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:navy;stroke-width:4px;}#mermaid .vtx{fill:navy;font-size:11px;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="0" y="0" width="784" height="148" fill="white"/><rect class="sec0" x="0" y="48" width="746.5" height="48"/><line class="grid" x1="75" y1="48" x2="75" y2="96"/><text class="tick" x="75" y="110" text-anchor="middle" dominant-baseline="central">17:30</text><line class="grid" x1="188.21" y1="48" x2="188.21" y2="96"/><text class="tick" x="188.21" y="110" text-anchor="middle" dominant-baseline="central">17:35</text><line class="grid" x1="301.43" y1="48" x2="301.43" y2="96"/><text class="tick" x="301.43" y="110" text-anchor="middle" dominant-baseline="central">17:40</text><line class="grid" x1="414.64" y1="48" x2="414.64" y2="96"/><text class="tick" x="414.64" y="110" text-anchor="middle" dominant-baseline="central">17:45</text><line class="grid" x1="527.86" y1="48" x2="527.86" y2="96"/><text cl