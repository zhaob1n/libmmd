<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="1008" height="338" viewBox="-4 -4 1008 338" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:#ddd;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:#ff8888;stroke-width:2px;stroke-dasharray:4 2;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="-4" y="-4" width="1008" height="338" fill="white"/><rect class="sec0" x="0" y="48" width="1000" height="72"/><text class="stitle" x="10" y="84" text-anchor="start" dominant-baseline="central">Design</text><rect class="sec1" x="0" y="120" width="1000" height="72"/><text class="stitle" x="10" y="156" text-anchor="start" dominant-baseline="central">Build</text><rect class="sec2" x="0" y="192" width="1000" height="96"/><text class="stitle" x="10" y="240" text-anchor="start" dominant-baseline="central">Ship</text><line class="grid" x1="271.15" y1="48" x2="271.15" y2="288"/><text class="tick" x="271.15" y="302" text-anchor="middle" dominant-baseline="central">Jan 11</text><line class="grid" x1="500" y1="48" x2="500" y2="288"/><text class="tick" x="500" y="302" text-anchor="middle" dominant-baseline="central">Jan 18</text><line class="grid" x1="728.85" y1="48