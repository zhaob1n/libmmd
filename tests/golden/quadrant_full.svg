<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="quadrantChart" width="528" height="538" viewBox="-4 -4 528 538" role="graphics-document document" aria-roledescription="quadrantChart"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .q1{fill:#ECECFF;}#mermaid .q2{fill:#f1f1ff;}#mermaid .q3{fill:#f6f6ff;}#mermaid .q4{fill:#fbfbff;}#mermaid .bd{stroke:#c7c7f1;stroke-width:2px;fill:none;}#mermaid .in{stroke:#c7c7f1;stroke-width:1px;}#mermaid .ql{font-size:16px;fill:#131300;}#mermaid .al{font-size:16px;fill:#131300;}#mermaid .pl{font-size:12px;fill:#131300;}#mermaid .ttl{font-size:20px;}</style><rect x="-4" y="-4" width="528" height="538" fill="white"/><text class="ttl" x="280" y="30" text-anchor="middle" dominant-baseline="central">Reach and engagement of campaigns</text><rect class="q1" x="280" y="70" width="210" height="210"/><text class="ql" x="385" y="90" text-anchor="middle" dominant-baseline="central">We should expand</text><rect class="q2" x="70" y="70" width="210" height="210"/><text class="ql" x="175" y="90" text-anchor="middle" dominant-baseline="central">Need to promote</text><rect class="q3" x="70" y="280" width="210" height="210"/><text class="ql" x="175" y="300" text-anchor="middle" dominant-baseline="central">Re-evaluate</text><rect class="q4" x="280" y="280" width="210" height="210"/><text class="ql" x="385" y="300" text-anchor="middle" dominant-baseline="central">May be improved</text><line class="in" x1="280" y1="70" x2="280" y2="490"/><line class="in" x1="70" y1="280" x2="490" y2="280"/><rect class="bd" x="70" y="70" width="420" height="420"/><text class="al" x="175" y="510" text-anchor="middle" dominant-baseline="central">Low Reach</text><text class="al" x="385" y="510" text-anchor="middle" dominant-baseline="central">High Reach</text><text class="al" text-anchor="middle" dominant-baseline="central" transform="translate(52,385) rotate(-90)">Low Engagement</text><text class="al" text-anchor="middle" dominant-baseline="central" transform="translate(52,175) rotate(-90)">High Engagement</text><circle cx="196" cy="238" r="5" fill="#0000eb"/><circle cx="259" cy="393.4" r="12" fill="#ff3300" stroke="#10f0f0" stroke-width="3"/><circle cx="309.4" cy="200.2" r="8" fill="#109060"/><circle cx="397.6" cy="347.2" r="5" fill="#0000eb"/><circle cx="238" cy="347.2" r="5" fill="#0000eb"/><circle cx="217" cy="162.4" r="5" fill="#0000eb"/><text class="pl" x="196" y="253" text-anchor="middle" dominant-baseline="central">Campaign A</text><text class="pl" x="259" y="416.9" text-anchor="middle" dominant-baseline="central">Campaign B</text><text class="pl" x="309.4" y="218.2" text-anchor="middle" dominant-baseline="central">Campaign C</text><text class="pl" x="397.6" y="362.2" text-anchor="middle" dominant-baseline="central">Campaign D</text><text class="pl" x="238" y="362.2" text-anchor="middle" dominant-baseline="central">Campaign E</text><text class="pl" x="217" y="177.4" text-anchor="middle" dominant-baseline="central">Campaign F</text></svg>
