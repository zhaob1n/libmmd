<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="784" height="148" viewBox="0 0 784 148" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:lightgrey;opacity:.8;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .exr{fill:#eee;stroke:none;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:navy;stroke-width:4px;}#mermaid .vtx{fill:navy;font-size:11px;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="0" y="0" width="784" height="148" fill="white"/><rect class="sec0" x="0" y="48" width="746.5" height="48"/><text class="stitle" x="10" y="72" text-anchor="start" dominant-baseline="central">Section</text><line class="grid" x1="117.27" y1="48" x2="117.27" y2="96"/><text class="tick" x="117.27" y="110" text-anchor="middle" dominant-baseline="central">2014-01-05</text><line class="grid" x1="191.23" y1="48" x2="191.23" y2="96"/><text class="tick" x="191.23" y="110" text-anchor="middle" dominant-baseline="central">2014-01-12</text><line class="grid" x1="265.2" y1="48" x2="265.2" y2="96"/><text class="tick" x="265.2" y="110" text-anchor="middle" dominant-baseline="central">2014-01-19</text><line class="grid" x1="339.17" y1="48" x2="339.17" y2="96"/><text class="tick" x="339.17" y="110" text-anchor="middle" dominant-baseline="central">2014-01-26</text><line class="grid" x1="413.13" y1="48" x2="413.13" y2="96"/><text class="tick" x="413.13" y="110" text-anchor="middle" dominant-baseline="central">2014-02-02</text><line class="grid" x1="487.1" y1="48" x2="487.1" y2="96"/><text class="tick" x="487.1" y="110" text-anchor="middle" dominant-baseline="central">2014-02-09</text><line class="grid" x1="561.07" y1="48" x2="561.07" y2="96"/><text class="tick" x="561.07" y="110" text-anchor="middle" dominant-baseline="central">2014-02-16</text><line class="grid" x1="635.03" y1="48" x2="635.03" y2="96"/><text class="tick" x="635.03" y="110" text-anchor="middle" dominant-baseline="central">2014-02-23</text><line class="grid" x1="709" y1="48" x2="709" y2="96"/><text class="tick" x="709" y="110" text-anchor="middle" dominant-baseline="central">2014-03-02</text><rect class="task" x="75" y="50" width="317" height="20" rx="3"/><text class="tin" x="233.5" y="60" text-anchor="middle" dominant-baseline="central">A task</text><rect class="task" x="276" y="74" width="264" height="20" rx="3"/><text class="tin" x="408" y="84" text-anchor="middle" dominant-baseline="central">Another task</text><rect class="task" x="498" y="50" width="211" height="20" rx="3"/><text class="tin" x="603.5" y="60" text-anchor="middle" dominant-baseline="central">Another one</text><text class="ttl" x="392" y="25" text-anchor="middle" dominant-baseline="central">A Gantt Diagram</text></svg>
