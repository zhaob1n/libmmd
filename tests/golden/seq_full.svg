<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="sequence" width="1420.8" height="1290" viewBox="-160 -10 1420.8 1290" role="graphics-document document" aria-roledescription="sequence"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid .actor{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .actor-man circle,#mermaid .actor-line{fill:#ECECFF;stroke:#9370DB;stroke-width:2px;}#mermaid text{fill:#333;}#mermaid .lifeline{stroke:#999;stroke-width:0.5px;}#mermaid .msg{stroke:#333;stroke-width:1.5px;fill:none;}#mermaid .msg.dotted{stroke-dasharray:3,3;}#mermaid .note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#mermaid .act{fill:#f4f4f4;stroke:#666;stroke-width:1px;}#mermaid .block{fill:none;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-sep{stroke:#526e9c;stroke-width:1.5px;stroke-dasharray:3,3;}#mermaid .block-tab{fill:#ECECFF;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-kw{font-size:14px;font-weight:bold;}#mermaid .seqnum{fill:#333;}#mermaid .seqnum-t{fill:#fff;font-size:12px;}#mermaid .title{font-size:18px;}#mermaid .box{stroke:rgba(0,0,0,0.5);stroke-width:1px;}#mermaid .destroy{stroke:#333;stroke-width:2px;fill:none;}</style><defs><marker id="sq-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#333"/></marker><marker id="sq-arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#333"/></marker><marker id="sq-cross" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,10 M10,2 L2,10" stroke="#333" stroke-width="2"/></marker><marker id="sq-async" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12" fill="none" stro