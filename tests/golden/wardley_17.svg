ath d="M 249 259.8 L 289 259.8 L 289 251.8 L 309 274.8 L 289 297.8 L 289 289.8 L 249 289.8 Z" class="wardley-accelerator" fill="white" stroke-width="1"/><text x="279" y="304.8" text-anchor="middle" font-size="10" font-weight="bold">AI Adoption</text></g><g class="wardley-deaccelerators"><path d="M 711 461.4 L 671 461.4 L 671 453.4 L 651 476.4 L 671 499.4 L 671 491.4 L 711 491.4 Z" class="wardley-accelerator" fill="white" stroke-width="1"/><text x="681" y="506.4" text-anchor="middle" font-size="10" font-weight="bold">Legacy Constraints</text></g></g><defs><marker id="mermaid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wardley-trend-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 10 0 L 0 5 L 10 10 z" stroke="none"/></marker></defs></svg>
