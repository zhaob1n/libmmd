<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="wardley" width="900" height="600" viewBox="0 0 900 600" role="graphics-document document" aria-roledescription="wardley"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid .wardley-background{fill:white;}#mermaid .wardley-halo{stroke:white;}#mermaid text{fill:#131300;}#mermaid .wardley-node-label{fill:#131300;}#mermaid .wardley-annotation text,#mermaid .wardley-annotations-box text{fill:#131300;}#mermaid .wardley-axes line,#mermaid .wardley-stages line,#mermaid .wardley-pipeline-box{stroke:#333333;}#mermaid .wardley-link,#mermaid .wardley-pipeline-evolution-link{stroke:#333333;}#mermaid .wardley-link-arrow{fill:#333333;}#mermaid .wardley-trend{stroke:#dc3545;}#mermaid .wardley-trend-arrow{fill:#dc3545;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot{fill:white;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot,#mermaid .wardley-buy-overlay,#mermaid .wardley-outsource-overlay,#mermaid .wardley-market-line,#mermaid .wardley-inertia,#mermaid .wardley-accelerator{stroke:#333333;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{fill:white;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{stroke:#333333;}</style><rect x="0" y="0" width="900" height="600" fill="white"/><g class="wardley-map"><rect class="wardley-background" width="900" height="600"/><text x="450" y="24" class="wardley-title" font-size="12.6" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Forces</text><g class="wardley-axes"><line x1="48" y1="552" x2="852" y2="552" stroke-width="1"/><line x1="48" y1="48" x2="48" y2="552" stroke-width="1"/><text x="450" y="588" class="wardley-axis-label" font-size="12" font-weight="bold" text-anchor="middle">Evolution</text><text class="wardley-axis-lab