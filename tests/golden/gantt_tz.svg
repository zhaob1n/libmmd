<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="784" height="172" viewBox="0 0 784 172" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:lightgrey;opacity:.8;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .exr{fill:#eee;stroke:none;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:navy;stroke-width:4px;}#mermaid .vtx{fill:navy;font-size:11px;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="0" y="0" width="784" height="172" fill="white"/><rect class="sec0" x="0" y="48" width="746.5" height="72"/><text class="stitle" x="10" y="84" text-anchor="start" dominant-baseline="central">Ops</text><rect class="exr" x="117.64" y="48" width="88.98" height="72"/><rect class="exr" x="429.08" y="48" width="88.98" height="72"/><line class="grid" x1="162.13" y1="48" x2="162.13" y2="120"/><text class="tick" x="162.13" y="134" text-anchor="middle" dominant-baseline="central">10-03 00:00</text><line class="grid" x1="251.11" y1="48" x2="251.11" y2="120"/><text class="tick" x="251.11" y="134" text-anchor="middle" dominant-baseline="central">10-05 00:00</text><line class="grid" x1="340.09" y1="48" x2="340.09" y2="120"/><text class="tick" x="340.09" y="134" text-anchor="middle" dominant-baseline="central">10-07 00:00</text><line class="grid" x1="429.08" y1="48" x2="429.08" y2="120"/><text class="tick" x="429.08" y="134" text-anchor="middle" dominant-baseline="central">10-09 00:00</text><line class="grid" x1="518.06" y1="48" x2="518.06" y2="120"/><text class="tick" x="518.06" y="134" text-anchor="middle" dominant-baseline="central">10-11 00:00</text><line class="grid" x1="607.04" y1="48" x2="607.04" y2="120"/><text class="tick" x="607.04" y="134" text-anchor="middle" dominant-baseline="central">10-13 00:00</text><line class="grid" x1="696.02" y1="48" x2="696.02" y2="120"/><text class="tick" x="696.02" y="134" text-anchor="middle" dominant-baseline="central">10-15 00:00</text><rect class="task" x="86" y="50" width="223" height="20" rx="3"/><text class="tin" x="197.5" y="60" text-anchor="middle" dominant-baseline="central">Deploy EU</text><rect class="task" x="75" y="74" width="178" height="20" rx="3"/><text class="tin" x="164" y="84" text-anchor="middle" dominant-baseline="central">Deploy Asia</text><rect class="task" x="309" y="98" width="400" height="20" rx="3"/><text class="tin" x="509" y="108" text-anchor="middle" dominant-baseline="central">Verify</text><text class="ttl" x="392" y="25" text-anchor="middle" dominant-baseline="central">Time zones and weekends</text></svg>
