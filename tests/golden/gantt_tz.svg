<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="1008" height="170" viewBox="-4 -4 1008 170" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:#ddd;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:#ff8888;stroke-width:2px;stroke-dasharray:4 2;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="-4" y="-4" width="1008" height="170" fill="white"/><rect class="sec0" x="0" y="48" width="1000" height="72"/><text class="stitle" x="10" y="84" text-anchor="start" dominant-baseline="central">Ops</text><line class="grid" x1="75" y1="48" x2="75" y2="120"/><text class="tick" x="75" y="134" text-anchor="middle" dominant-baseline="central">10-01 01:00</text><line class="grid" x1="194.3" y1="48" x2="194.3" y2="120"/><text class="tick" x="194.3" y="134" text-anchor="middle" dominant-baseline="central">10-03 01:00</text><line class="grid" x1="313.6" y1="48" x2="313.6" y2="120"/><text class="tick" x="313.6" y="134" text-anchor="middle" dominant-baseline="central">10-05 01:00</text><line class="grid" x1="432.89" y1="48" x2="432.89" y2="120"/><text class="tick" x="432.89" y="134" text-anchor="middle" dominant-baseline="central">10-07 01:00</text><line class="grid" x1="552.19" y1="48" x2="552.19" y2="120"/><text class="tick" x="552.19" y="134" text-anchor="middle" dominant-baseline="central">10-09 01:00</text><line class="grid" x1="671.49" y1="48" x2="671.49" y2="120"/><text class="tick" x="671.49" y="134" text-anchor="middle" dominant-baseline="central">10-11 01:00</text><line class="grid" x1="790.79" y1="48" x2="790.79" y2="120"/><text class="tick" x="790.79" y="134" text-anchor="middle" dominant-baseline="central">10-13 01:00</text><line class="grid" x1="910.09" y1="48" x2="910.09" y2="120"/><text class="tick" x="910.09" y="134" text-anchor="middle" dominant-baseline="central">10-15 01:00</text><rect class="task" x="89.91" y="50" width="298.25" height="20" rx="3"/><text class="tin" x="239.04" y="60" text-anchor="middle" dominant-baseline="central">Deploy EU</text><rect class="task" x="75" y="74" width="238.6" height="20" rx="3"/><text class="tin" x="194.3" y="84" text-anchor="middle" dominant-baseline="central">Deploy Asia</text><rect class="task" x="388.16" y="98" width="536.84" height="20" rx="3"/><text class="tin" x="656.58" y="108" text-anchor="middle" dominant-baseline="central">Verify</text><text class="ttl" x="500" y="25" text-anchor="middle" dominant-baseline="central">Time zones and weekends</text></svg>
