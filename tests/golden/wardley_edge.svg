<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="wardley" width="300" height="200" viewBox="0 0 300 200" role="graphics-document document" aria-roledescription="wardley"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid .wardley-background{fill:white;}#mermaid .wardley-halo{stroke:white;}#mermaid text{fill:#131300;}#mermaid .wardley-node-label{fill:#131300;}#mermaid .wardley-annotation text,#mermaid .wardley-annotations-box text{fill:#131300;}#mermaid .wardley-axes line,#mermaid .wardley-stages line,#mermaid .wardley-pipeline-box{stroke:#333333;}#mermaid .wardley-link,#mermaid .wardley-pipeline-evolution-link{stroke:#333333;}#mermaid .wardley-link-arrow{fill:#333333;}#mermaid .wardley-trend{stroke:#dc3545;}#mermaid .wardley-trend-arrow{fill:#dc3545;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot{fill:white;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot,#mermaid .wardley-buy-overlay,#mermaid .wardley-outsource-overlay,#mermaid .wardley-market-line,#mermaid .wardley-inertia,#mermaid .wardley-accelerator{stroke:#333333;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{fill:white;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{stroke:#333333;}</style><rect x="0" y="0" width="300" height="200" fill="white"/><g class="wardley-map"><rect class="wardley-background" width="300" height="200"/><text x="150" y="24" class="wardley-title" font-size="12.6" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Edge</text><g class="wardley-axes"><line x1="48" y1="152" x2="252" y2="152" stroke-width="1"/><line x1="48" y1="48" x2="48" y2="152" stroke-width="1"/><text x="150" y="188" class="wardley-axis-label" font-size="12" font-weight="bold" text-anchor="middle">Evolution</text><text class="wardley-axis-label" x="16" y="100" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 16 100)">Visibility</text></g><g class="wardley-stages"><text x="73.5" y="168" class="wardley-stage-label" font-size="10" text-anchor="middle">Genesis</text><line x1="99" y1="48" x2="99" y2="152" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="124.5" y="168" class="wardley-stage-label" font-size="10" text-anchor="middle">Custom Built</text><line x1="150" y1="48" x2="150" y2="152" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="175.5" y="168" class="wardley-stage-label" font-size="10" text-anchor="middle">Product</text><line x1="201" y1="48" x2="201" y2="152" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="226.5" y="168" class="wardley-stage-label" font-size="10" text-anchor="middle">Commodity</text></g><g class="wardley-pipelines"></g><g class="wardley-pipeline-links"></g><g class="wardley-links"><line class="wardley-link" x1="236.29" y1="137.15" x2="156.23" y2="102.68" stroke-width="1"/></g><g class="wardley-trends"><line x1="150" y1="100" x2="60.08" y2="100" class="wardley-trend" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#mermaid-arrow)"/></g><g class="wardley-nodes"><g class="wardley-node wardley-node--component"><circle cx="241.8" cy="139.52" r="12" class="wardley-build-overlay" fill="#eee" stroke="#000" stroke-width="1"/><circle cx="241.8" cy="139.52" r="6" class="wardley-component" stroke-width="1"/><line x1="278.8" y1="133.52" x2="278.8" y2="145.52" class="wardley-inertia" stroke-width="6"/><text x="261.8" y="129.52" class="wardley-node-label" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">A b</text></g><g class="wardley-node wardley-node--component"><rect class="wardley-component" x="145.2" y="95.2" width="9.6" height="9.6" stroke-width="1"/><text x="158" y="92" class="wardley-node-label" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">B</text></g></g><g class="wardley-annotations"><g class="wardley-annotation"><circle cx="88.8" cy="131.2" r="10" stroke-width="1.5"/><text x="88.8" y="131.2" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold">1</text></g></g><g class="wardley-notes"><text x="68.4" y="141.6" text-anchor="start" font-size="11" font-weight="bold">x &lt;&amp;&gt; y</text></g></g><defs><marker id="mermaid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wardley-trend-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 10 0 L 0 5 L 10 10 z" stroke="none"/></marker></defs></svg>
