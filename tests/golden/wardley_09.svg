<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="wardley" width="900" height="600" viewBox="0 0 900 600" role="graphics-document document" aria-roledescription="wardley"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><rect x="0" y="0" width="900" height="600" fill="white"/><g class="wardley-map"><rect class="wardley-background" width="900" height="600" fill="white"/><text x="450" y="24" class="wardley-title" fill="#131300" font-size="12.6" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Link Types</text><g class="wardley-axes"><line x1="48" y1="552" x2="852" y2="552" stroke="#333333" stroke-width="1"/><line x1="48" y1="48" x2="48" y2="552" stroke="#333333" stroke-width="1"/><text x="450" y="588" class="wardley-axis-label" fill="#131300" font-size="12" font-weight="bold" text-anchor="middle">Evolution</text><text class="wardley-axis-label" x="16" y="300" fill="#131300" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 16 300)">Visibility</text></g><g class="wardley-stages"><text x="148.5" y="568" class="wardley-stage-label" fill="#131300" font-size="10" text-anchor="middle">Genesis</text><line x1="249" y1="48" x2="249" y2="552" stroke="#000" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="349.5" y="568" class="wardley-stage-label" fill="#131300" font-size="10" text-anchor="middle">Custom Built</text><line x1="450" y1="48" x2="450" y2="552" stroke="#000" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="550.5" y="568" class="wardley-stage-label" fill="#131300" font-size="10" text-anchor="middle">Product</text><line x1="651" y1="48" x2="651" y2="552" stroke="#000" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="751.5" y="568" class="wardley-stage-label" fill="#131300" font-size="10" text-anchor="middle">Commodity</text></g><g class="wardley-links"><line