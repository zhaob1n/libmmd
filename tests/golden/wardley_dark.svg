<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="wardley" width="900" height="600" viewBox="0 0 900 600" role="graphics-document document" aria-roledescription="wardley"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid .wardley-background{fill:#333;}#mermaid .wardley-halo{stroke:#333;}#mermaid text{fill:#e0dfdf;}#mermaid .wardley-node-label{fill:#e0dfdf;}#mermaid .wardley-annotation text,#mermaid .wardley-annotations-box text{fill:#e0dfdf;}#mermaid .wardley-axes line,#mermaid .wardley-stages line,#mermaid .wardley-pipeline-box{stroke:lightgrey;}#mermaid .wardley-link,#mermaid .wardley-pipeline-evolution-link{stroke:lightgrey;}#mermaid .wardley-link-arrow{fill:lightgrey;}#mermaid .wardley-trend{stroke:#ff6b6b;}#mermaid .wardley-trend-arrow{fill:#ff6b6b;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot{fill:#1f2020;}#mermaid .wardley-component,#mermaid .wardley-market-overlay,#mermaid .wardley-market-dot,#mermaid .wardley-buy-overlay,#mermaid .wardley-outsource-overlay,#mermaid .wardley-market-line,#mermaid .wardley-inertia,#mermaid .wardley-accelerator{stroke:lightgrey;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{fill:#1f2020;}#mermaid .wardley-annotation circle,#mermaid .wardley-annotations-box rect{stroke:lightgrey;}#mermaid{fill:#ccc;}</style><rect x="0" y="0" width="900" height="600" fill="#333"/><g class="wardley-map"><rect class="wardley-background" width="900" height="600"/><text x="450" y="24" class="wardley-title" font-size="12.6" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Dark map</text><g class="wardley-axes"><line x1="48" y1="552" x2="852" y2="552" stroke-width="1"/><line x1="48" y1="48" x2="48" y2="552" stroke-width="1"/><text x="450" y="588" class="wardley-axis-label" font-size="12" font-weight="bold" text-anchor="middle">Evolution</text><text class="wardley-axis-label" x="16" y="300" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 16 300)">Visibility</text></g><g class="wardley-stages"><text x="148.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Genesis</text><line x1="249" y1="48" x2="249" y2="552" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="349.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Custom Built</text><line x1="450" y1="48" x2="450" y2="552" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="550.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Product</text><line x1="651" y1="48" x2="651" y2="552" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"/><text x="751.5" y="568" class="wardley-stage-label" font-size="10" text-anchor="middle">Commodity</text></g><g class="wardley-links"><line class="wardley-link" x1="806.72" y1="101.59" x2="696.28" y2="170.81" stroke-width="1"/><line class="wardley-link" x1="694.02" y1="179.3" x2="808.98" y2="395.5" stroke-width="1"/></g><g class="wardley-trends"><line x1="691.2" y1="174" x2="763.6" y2="174" class="wardley-trend" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#mermaid-arrow)"/></g><g class="wardley-nodes"><g class="wardley-node wardley-node--anchor"><text x="811.8" y="95.4" class="wardley-node-label" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="middle">User</text></g><g class="wardley-node wardley-node--component"><circle cx="691.2" cy="174" r="12" class="wardley-build-overlay" fill="#eee" stroke="#000" stroke-width="1"/><circle cx="691.2" cy="174" r="6" class="wardley-component" stroke-width="1"/><text x="655.4" y="156" class="wardley-node-label" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">App</text></g><g class="wardley-node wardley-node--component"><circle cx="811.8" cy="400.8" r="12" class="wardley-market-overlay" stroke-width="1"/><line x1="811.8" y1="393.6" x2="805.56" y2="404.4" class="wardley-market-line" stroke-width="1"/><line x1="805.56" y1="404.4" x2="818.04" y2="404.4" class="wardley-market-line" stroke-width="1"/><line x1="818.04" y1="404.4" x2="811.8" y2="393.6" class="wardley-market-line" stroke-width="1"/><circle cx="811.8" cy="393.6" r="4.2" class="wardley-market-dot" stroke-width="2"/><circle cx="805.56" cy="404.4" r="4.2" class="wardley-market-dot" stroke-width="2"/><circle cx="818.04" cy="404.4" r="4.2" class="wardley-market-dot" stroke-width="2"/><text x="829.8" y="382.8" class="wardley-node-label" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">Cloud</text></g></g><g class="wardley-annotations"><g class="wardley-annotation"><circle cx="530.4" cy="199.2" r="10" stroke-width="1.5"/><text x="530.4" y="199.2" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold">1</text></g><g class="wardley-annotations-box"><rect x="208.8" y="501.6" width="216.13" height="42.5" stroke-width="1.5" rx="4" ry="4"/><text x="218.8" y="527.6" font-size="11" text-anchor="start" dominant-baseline="middle">1. Integration layer</text></g></g><g class="wardley-notes"><text x="450" y="249.6" text-anchor="start" font-size="11" font-weight="bold">Go cloud</text></g></g><defs><marker id="mermaid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wardley-trend-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 0 0 L 10 5 L 0 10 z" stroke="none"/></marker><marker id="mermaid-link-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="wardley-link-arrow" d="M 10 0 L 0 5 L 10 10 z" stroke="none"/></marker></defs></svg>
