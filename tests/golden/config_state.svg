<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="statediagram" width="71.34" height="278" viewBox="-35.67 -10 71.34 278" role="graphics-document document" aria-roledescription="statediagram" aria-describedby="chart-desc-mermaid"><desc id="chart-desc-mermaid">A two-state
        machine</desc><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .st{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .bar,#mermaid .start{fill:#333;stroke:none;}#mermaid .endo{fill:#fff;stroke:#333;stroke-width:1.5px;}#mermaid .endi{fill:#333;}#mermaid .choice{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .comp{fill:#fff;stroke:#9370DB;stroke-width:1px;}#mermaid .comp-t{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .region{fill:none;stroke:#888;stroke-width:1px;stroke-dasharray:5,4;}#mermaid .div{stroke:#9370DB;stroke-width:1px;}#mermaid .tr{fill:none;stroke:#333;stroke-width:1.3px;}#mermaid .lbl{fill:#e8e8e8;opacity:0.85;}#mermaid .note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#mermaid .note-l{stroke:#aaaa33;stroke-width:1px;stroke-dasharray:3,3;}#mermaid .st{fill:#ffcccc;}#mermaid .st{stroke:#aa0000;}#mermaid .tr{stroke:#0000aa;}#mermaid .tr,#mermaid .endo{stroke:#0000aa;}#mermaid .bar,#mermaid .start,#mermaid .endi{fill:#0000aa;}#mermaid marker path{fill:#0000aa;stroke:#0000aa;}</style><rect x="-35.67" y="-10" width="71.34" height="278" fill="white"/><defs><marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><path class="tr" d="M0,14L0,64" marker-end="url(#st-arrow)"/><path class="tr" d="M0,104L0,154" marker-end="url(#st-arrow)"/><path class="tr" d="M0,194L0,244" marker-end="url(#st-arrow)"/><circle class="start" cx="0" cy="7" r="7"/><rect class="st" x="-25.67" y="64" width="51.34" height="40" rx="5"/><text x="0" y="84" text-anchor="middle" dominant-baseline="central">On</text><rect class="st" x="-25.67" y="154" width="51.34" height="40" rx="5"/><text x="0" y="174" text-anchor="middle" dominant-baseline="central">Off</text><circle class="endo" cx="0" cy="251" r="7"/><circle class="endi" cx="0" cy="251" r="4"/></svg>
