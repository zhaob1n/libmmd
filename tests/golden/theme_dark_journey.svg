<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="journey" width="1500" height="540" viewBox="0 -25 1500 540" role="graphics-document document" aria-roledescription="journey"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .face{fill:#FFF8DC;stroke:#999;stroke-width:1px;}#mermaid .feat{fill:none;stroke:#666;stroke-width:1.5px;}#mermaid .eye{fill:#666;}#mermaid .tl{stroke:#666;stroke-width:1px;stroke-dasharray:4 4;}#mermaid .tbox{stroke:#666;stroke-width:1px;}#mermaid .axis{stroke:#000;stroke-width:4px;}#mermaid .ttl{font-size:20px;font-weight:bold;}#mermaid .tx{font-size:14px;}#mermaid .adot{stroke:#000;stroke-width:1px;}#mermaid{fill:#ccc;}#mermaid .axis,#mermaid .adot,#mermaid .tl{stroke:lightgrey;}#mermaid .ttl{fill:#ccc;}</style><rect x="0" y="-25" width="1500" height="540" fill="#333"/><text class="ttl" x="150" y="25" text-anchor="start" dominant-baseline="central">My working day</text><circle class="adot" r="7" cx="20" cy="60" fill="#8FBC8F"/><text class="tx" x="40" y="60" text-anchor="start" dominant-baseline="central">Cat</text><circle class="adot" r="7" cx="20" cy="80" fill="#7CFC00"/><text class="tx" x="40" y="80" text-anchor="start" dominant-baseline="central">Dog</text><circle class="adot" r="7" cx="20" cy="100" fill="#00FFFF"/><text class="tx" x="40" y="100" text-anchor="start" dominant-baseline="central">Me</text><rect class="tbox" x="150" y="50" width="550" height="50" rx="3" fill="#1f2020"/><text class="tx" x="425" y="75" text-anchor="middle" dominant-baseline="central">Go to work</text><rect class="tbox" x="750" y="50" width="550" height="50" rx="3" fill="hsl(180, 1.5873015873%, 28.3529411765%)"/><text class="tx" x="1025" y="75" text-anchor="middle" dominant-baseline="central">Go home</text><line class="tl" x1="225" y1="110" x2="225" y2="450"/><rect class="tbox" x="150" y="110" width="150" height="50" rx="3" fill="#1f2020"/><text class="tx" x="225" y="135" text-anchor="middle" dominant-baseline="central">Make tea</text><circle class="face" cx="225" cy="300" r="15"/><circle class="eye" r="1.5" cx="220" cy="295"/><circle class="eye" r="1.5" cx="230" cy="295"/><path class="feat" d="M218,302Q225,310 232,302"/><circle class="adot" r="7" cx="164" cy="110" fill="#00FFFF"/><line class="tl" x1="425" y1="110" x2="425" y2="450"/><rect class="tbox" x="350" y="110" width="150" height="50" rx="3" fill="#1f2020"/><text class="tx" x="425" y="135" text-anchor="middle" dominant-baseline="central">Go upstairs</text><circle class="face" cx="425" cy="360" r="15"/><circle class="eye" r="1.5" cx="420" cy="355"/><circle class="eye" r="1.5" cx="430" cy="355"/><line class="feat" x1="419" y1="366" x2="431" y2="366"/><circle class="adot" r="7" cx="364" cy="110" fill="#00FFFF"/><line class="tl" x1="625" y1="110" x2="625" y2="450"/><rect class="tbox" x="550" y="110" width="150" height="50" rx="3" fill="#1f2020"/><text class="tx" x="625" y="135" text-anchor="middle" dominant-baseline="central">Do work</text><circle class="face" cx="625" cy="420" r="15"/><circle class="eye" r="1.5" cx="620" cy="415"/><circle class="eye" r="1.5" cx="630" cy="415"/><path class="feat" d="M618,428Q625,421 632,428"/><circle class="adot" r="7" cx="564" cy="110" fill="#00FFFF"/><circle class="adot" r="7" cx="574" cy="110" fill="#8FBC8F"/><line class="tl" x1="825" y1="110" x2="825" y2="450"/><rect class="tbox" x="750" y="110" width="150" height="50" rx="3" fill="hsl(180, 1.5873015873%, 28.3529411765%)"/><text class="tx" x="825" y="135" text-anchor="middle" dominant-baseline="central">Go downstairs</text><circle class="face" cx="825" cy="300" r="15"/><circle class="eye" r="1.5" cx="820" cy="295"/><circle class="eye" r="1.5" cx="830" cy="295"/><path class="feat" d="M818,302Q825,310 832,302"/><circle class="adot" r="7" cx="764" cy="110" fill="#00FFFF"/><line class="tl" x1="1025" y1="110" x2="1025" y2="450"/><rect class="tbox" x="950" y="110" width="150" height="50" rx="3" fill="hsl(180, 1.5873015873%, 28.3529411765%)"/><text class="tx" x="1025" y="135" text-anchor="middle" dominant-baseline="central">Sit down</text><circle class="face" cx="1025" cy="330" r="15"/><circle class="eye" r="1.5" cx="1020" cy="325"/><circle class="eye" r="1.5" cx="1030" cy="325"/><path class="feat" d="M1018,332Q1025,340 1032,332"/><circle class="adot" r="7" cx="964" cy="110" fill="#00FFFF"/><circle class="adot" r="7" cx="974" cy="110" fill="#8FBC8F"/><circle class="adot" r="7" cx="984" cy="110" fill="#7CFC00"/><line class="tl" x1="1225" y1="110" x2="1225" y2="450"/><rect class="tbox" x="1150" y="110" width="150" height="50" rx="3" fill="hsl(180, 1.5873015873%, 28.3529411765%)"/><text class="tx" x="1225" y="124.5" text-anchor="middle" dominant-baseline="central">Long task</text><text class="tx" x="1225" y="145.5" text-anchor="middle" dominant-baseline="central">two lines</text><circle class="face" cx="1225" cy="390" r="15"/><circle class="eye" r="1.5" cx="1220" cy="385"/><circle class="eye" r="1.5" cx="1230" cy="385"/><path class="feat" d="M1218,398Q1225,391 1232,398"/><circle class="adot" r="7" cx="1164" cy="110" fill="#7CFC00"/><defs><marker id="jarrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z"/></marker></defs><line class="axis" marker-end="url(#jarrow)" x1="150" y1="200" x2="1346" y2="200"/></svg>
