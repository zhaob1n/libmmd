<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="c4" width="952.18" height="1404.02" viewBox="0 -70 952.18 1404.02" role="graphics-document document" aria-roledescription="c4"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .ct{fill:#fff;}#mermaid .ct.ext{fill:#fff;}#mermaid .cn{font-weight:bold;font-size:14px;}#mermaid .cs{font-size:10.5px;}#mermaid .cd{font-size:11.48px;}#mermaid .cb{fill:none;stroke:#444;stroke-width:1px;stroke-dasharray:7,7;}#mermaid .cbt{font-weight:bold;font-size:14px;fill:#444;}#mermaid .cbs{font-size:12px;fill:#444;}#mermaid .cr{fill:none;stroke:#444;stroke-width:1px;}#mermaid .crh{fill:#444;}#mermaid .crl{font-size:13px;fill:#444;}#mermaid .crt{font-size:12px;font-style:italic;fill:#444;}#mermaid .crx{fill:inherit;}#mermaid .crc .cr{stroke:inherit;}#mermaid .crc .crh{fill:inherit;}</style><rect x="0" y="-70" width="952.18" height="1404.02" fill="white"/><text class="cn" x="226.09" y="14.4" text-anchor="start" dominant-baseline="central">Container diagram for Internet Banking System</text><rect class="cb" x="150" y="718" width="652.18" height="516.02" rx="2.5"/><text class="cbt" x="476.09" y="732" text-anchor="middle" dominant-baseline="central">Internet Banking</text><text class="cbs" x="476.09" y="748" text-anchor="middle" dominant-baseline="central">[Container]</text><path class="cr" d="M266.67,381.97L303.03,818"/><path class="crh" d="M303.03,818L298.21,808.37L306.18,807.7z"/><text class="crl" x="287.76" y="626.87" text-anchor="middle" dominant-baseline="central">Uses</text><text class="crt" x="287.76" y="642.87" text-anchor="middle" dominant-baseline="central">[HTTPS]</text><path class="cr" d="M416,875.47L516,873.47"/><path class="crh" d="M516,873.47L506.08,877.67L505.92,869.67z"/><text class="crl" x="466" y="866.47" text-anchor="middle" dominant-baseline="central">Uses</text><text class="crt" x="466" y="882.47" text-anchor="middle" dominant-baseline="central">[async, JSON/HTTPS]</text><path class="cr" d="M553.6,924.63L404.89,1037.26"/><path class="crh" d="M404.89,1037.26L410.45,1028.03L415.28,1034.41z"/><text class="crl" x="479.25" y="972.94" text-anchor="middle" dominant-baseline="central">Reads from and writes to</text><text class="crt" x="479.25" y="988.94" text-anchor="middle" dominant-baseline="central">[sync, JDBC]</text><path class="cr" d="M626.85,924.63L632.86,1037.26"/><path class="crh" d="M632.86,1037.26L628.33,1027.49L636.32,1027.06z"/><text class="crl" x="629.85" y="980.94" text-anchor="middle" dominant-baseline="central">Publishes</text><path class="cr" d="M466,244.63L366,260.67"/><path class="crh" d="M366,260.67L375.24,255.14L376.51,263.03z"/><text class="crl" x="416" y="252.65" text-anchor="middle" dominant-baseline="central">Sends e-mails to</text><path class="cr" d="M564.57,818L326.01,604"/><path class="crh" d="M326.01,604L336.13,607.7L330.79,613.66z"/><path class="crh" d="M564.57,818L554.45,814.3L559.8,808.35z"/><text class="crl" x="445.29" y="703" text-anchor="middle" dominant-baseline="central">Uses</text><text class="crt" x="445.29" y="719" text-anchor="middle" dominant-baseline="central">[XML/HTTPS]</text><g class="c4-element" fill="#fff"><rect fill="#08427B" stroke="#073B6F" rx="38.23" x="150" y="259.95" width="216" height="122.03"/><circle fill="#08427B" stroke="#073B6F" cx="258" cy="223.68" r="49.68"/><text class="cn" x="258" y="289.45" text-anchor="middle" dominant-baseline="central">Personal Banking</text><text class="cn" x="258" y="304.85" text-anchor="middle" dominant-baseline="central">Customer</text><text class="cs" x="258" y="328.02" text-anchor="middle" dominant-baseline="central">[Person]</text><text class="cd" x="258" y="341.85" text-anchor="middle" dominant-baseline="central">A customer of the bank, with</text><text class="cd" x="258" y="354.47" text-anchor="middle" dominant-baseline="central">personal bank accounts.</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#999999" stroke="#8A8A8A" x="466" y="174" width="216" height="106.63"/><text class="cn" x="574" y="203.5" text-anchor="middle" dominant-baseline="central">E-Mail System</text><text class="cs" x="574" y="226.68" text-anchor="middle" dominant-baseline="central">[Software System]</text><text class="cd" x="574" y="240.5" text-anchor="middle" dominant-baseline="central">The internal Microsoft Exchange</text><text class="cd" x="574" y="253.13" text-anchor="middle" dominant-baseline="central">system</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="200" y="818" width="216" height="119.26"/><text class="cn" x="308" y="847.5" text-anchor="middle" dominant-baseline="central">Single-Page App</text><text class="cs" x="308" y="870.68" text-anchor="middle" dominant-baseline="central">[Container: JavaScript, Angular]</text><text class="cd" x="308" y="884.5" text-anchor="middle" dominant-baseline="central">Provides all the Internet banking</text><text class="cd" x="308" y="897.13" text-anchor="middle" dominant-baseline="central">functionality to customers via</text><text class="cd" x="308" y="909.76" text-anchor="middle" dominant-baseline="central">their web browser</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#438DD5" stroke="#3C7FC0" x="516" y="818" width="216" height="106.63"/><text class="cn" x="624" y="847.5" text-anchor="middle" dominant-baseline="central">API Application</text><text class="cs" x="624" y="870.68" text-anchor="middle" dominant-baseline="central">[Container: Java, Docker Container]</text><text class="cd" x="624" y="884.5" text-anchor="middle" dominant-baseline="central">Provides Internet banking</text><text class="cd" x="624" y="897.13" text-anchor="middle" dominant-baseline="central">functionality via API</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M200,1053.09a108,15.84 0 0 1 216,0v115.09a108,15.84 0 0 1 -216,0z M200,1053.09a108,15.84 0 0 0 216,0"/><text class="cn" x="308" y="1092.39" text-anchor="middle" dominant-baseline="central">Database</text><text class="cs" x="308" y="1115.56" text-anchor="middle" dominant-baseline="central">[Container: SQL Database]</text><text class="cd" x="308" y="1129.39" text-anchor="middle" dominant-baseline="central">Stores user registration</text><text class="cd" x="308" y="1142.02" text-anchor="middle" dominant-baseline="central">information, hashed auth</text><text class="cd" x="308" y="1154.64" text-anchor="middle" dominant-baseline="central">credentials, access logs, etc.</text></g><g class="c4-element" fill="#fff"><path fill="#438DD5" stroke="#3C7FC0" d="M522.73,1037.26h222.73a6.73,23 0 0 1 0,46h-222.73a6.73,23 0 0 1 0,-46z M745.45,1037.26a6.73,23 0 0 0 0,46"/><text class="cn" x="634.09" y="1051.76" text-anchor="middle" dominant-baseline="central">Events</text><text class="cs" x="634.09" y="1074.93" text-anchor="middle" dominant-baseline="central">[Container: Kafka]</text></g><g class="c4-element" fill="#fff"><rect rx="2.5" fill="#999999" stroke="#8A8A8A" x="150" y="481.97" width="216" height="122.03"/><text class="cn" x="258" y="511.47" text-anchor="middle" dominant-baseline="central">Mainframe Banking</text><text class="cn" x="258" y="526.87" text-anchor="middle" dominant-baseline="central">System</text><text class="cs" x="258" y="550.05" text-anchor="middle" dominant-baseline="central">[Software System]</text><text class="cd" x="258" y="563.87" text-anchor="middle" dominant-baseline="central">Stores all of the core banking</text><text class="cd" x="258" y="576.5" text-anchor="middle" dominant-baseline="central">information.</text></g></svg>
