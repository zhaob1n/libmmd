<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="gantt" width="1008" height="126" viewBox="-4 16 1008 126" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .sec0,#mermaid .sec2{fill:#6666ff;opacity:0.2;}#mermaid .sec1,#mermaid .sec3{fill:#fff400;opacity:0.2;}#mermaid .stitle{font-size:11px;fill:#333;}#mermaid .grid{stroke:lightgrey;opacity:.8;stroke-width:1px;}#mermaid .tick{font-size:10px;fill:#000;}#mermaid .exr{fill:#eee;stroke:none;}#mermaid .task{fill:#8a90dd;stroke:#534fbc;}#mermaid .done{fill:#d3d3d3;stroke:grey;}#mermaid .active{fill:#bfc7ff;stroke:#534fbc;}#mermaid .crit{fill:#ff8888;stroke:#ff0000;}#mermaid .crit.done{fill:#d3d3d3;stroke:#ff0000;}#mermaid .crit.active{fill:#ff8888;stroke:#ff0000;}#mermaid .tin{fill:#fff;font-size:11px;}#mermaid .tout{fill:#000;font-size:11px;}#mermaid .done+.tin,#mermaid .tin.dk{fill:#000;}#mermaid .today{stroke:red;stroke-width:2px;fill:none;}#mermaid .vert{stroke:#ff8888;stroke-width:2px;stroke-dasharray:4 2;}#mermaid .today{stroke:red;stroke-width:2px;}#mermaid .ttl{font-size:18px;}</style><rect x="-4" y="16" width="1008" height="126" fill="white"/><rect class="sec0" x="0" y="48" width="1000" height="48"/><text class="stitle" x="10" y="72" text-anchor="start" dominant-baseline="central">A</text><line class="grid" x1="177" y1="48" x2="177" y2="96"/><text class="tick" x="177" y="110" text-anchor="middle" dominant-baseline="central">07/01</text><line class="grid" x1="296" y1="48" x2="296" y2="96"/><text class="tick" x="296" y="110" text-anchor="middle" dominant-baseline="central">14/01</text><line class="grid" x1="415" y1="48" x2="415" y2="96"/><text class="tick" x="415" y="110" text-anchor="middle" dominant-baseline="central">21/01</text><line class="grid" x1="534" y1="48" x2="534" y2="96"/><text class="tick" x="534" y="110" text-anchor="middle" dominant-baseline="central">28/01</text><line class="grid" x1="653" y1="48" x2="653" y2="96"/><text class="tick" x="653" y="110" text-anchor="middle" dominant-baseline="central">04/02</text><line class="grid" x1="772" y1="48" x2="772" y2="96"/><text class="tick" x="772" y="110" text-anchor="middle" dominant-baseline="central">11/02</text><line class="grid" x1="891" y1="48" x2="891" y2="96"/><text class="tick" x="891" y="110" text-anchor="middle" dominant-baseline="central">18/02</text><rect class="task" x="75" y="50" width="510" height="20" rx="3"/><text class="tin" x="330" y="60" text-anchor="middle" dominant-baseline="central">one</text><rect class="task" x="585" y="74" width="340" height="20" rx="3"/><text class="tin" x="755" y="84" text-anchor="middle" dominant-baseline="central">two</text></svg>
