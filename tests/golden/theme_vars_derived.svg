<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="journey" width="700" height="540" viewBox="0 -25 700 540" role="graphics-document document" aria-roledescription="journey"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid .face{fill:#FFF8DC;stroke:#999;stroke-width:1px;}#mermaid .feat{fill:none;stroke:#666;stroke-width:1.5px;}#mermaid .eye{fill:#666;}#mermaid .tl{stroke:#666;stroke-width:1px;stroke-dasharray:4 4;}#mermaid .tbox{stroke:#666;stroke-width:1px;}#mermaid .axis{stroke:#000;stroke-width:4px;}#mermaid .ttl{font-size:20px;font-weight:bold;}#mermaid .tx{font-size:14px;}#mermaid .adot{stroke:#000;stroke-width:1px;}</style><rect x="0" y="-25" width="700" height="540" fill="white"/><text class="ttl" x="150" y="25" text-anchor="start" dominant-baseline="central">Day</text><circle class="adot" r="7" cx="20" cy="60" fill="#8FBC8F"/><text class="tx" x="40" y="60" text-anchor="start" dominant-baseline="central">Cat</text><circle class="adot" r="7" cx="20" cy="80" fill="#7CFC00"/><text class="tx" x="40" y="80" text-anchor="start" dominant-baseline="central">Me</text><rect class="tbox" x="150" y="50" width="350" height="50" rx="3" fill="#ff0000"/><text class="tx" x="325" y="75" text-anchor="middle" dominant-baseline="central">Work</text><line class="tl" x1="225" y1="110" x2="225" y2="450"/><rect class="tbox" x="150" y="110" width="150" height="50" rx="3" fill="#ff0000"/><text class="tx" x="225" y="135" text-anchor="middle" dominant-baseline="central">Code</text><circle class="face" cx="225" cy="300" r="15"/><circle class="eye" r="1.5" cx="220" cy="295"/><circle class="eye" r="1.5" cx="230" cy="295"/><path class="feat" d="M218,302Q225,310 232,302"/><circle class="adot" r="7" cx="164" cy="110" fill="#7CFC00"/><line class="tl" x1="425" y1="110" x2="425" y2="450"/><rect class="tbox" x="350" y="110" width="150" height="50" rx="3" fill="#ff0000"/><text class="tx" x="425" y="135" text-anchor="middle" dominant-baseline="central">Review</text><circle class="face" cx="425" cy="360" r="15"/><circle class="eye" r="1.5" cx="420" cy="355"/><circle class="eye" r="1.5" cx="430" cy="355"/><line class="feat" x1="419" y1="366" x2="431" y2="366"/><circle class="adot" r="7" cx="364" cy="110" fill="#7CFC00"/><circle class="adot" r="7" cx="374" cy="110" fill="#8FBC8F"/><defs><marker id="jarrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z"/></marker></defs><line class="axis" marker-end="url(#jarrow)" x1="150" y1="200" x2="546" y2="200"/></svg>
