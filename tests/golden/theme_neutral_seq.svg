<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="sequence" width="550" height="444" viewBox="-50 -10 550 444" role="graphics-document document" aria-roledescription="sequence"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid .actor{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .actor-man circle,#mermaid .actor-line{fill:#ECECFF;stroke:#9370DB;stroke-width:2px;}#mermaid text{fill:#333;}#mermaid .lifeline{stroke:#999;stroke-width:0.5px;}#mermaid .msg{stroke:#333;stroke-width:1.5px;fill:none;}#mermaid .msg.dotted{stroke-dasharray:3,3;}#mermaid .note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#mermaid .act{fill:#f4f4f4;stroke:#666;stroke-width:1px;}#mermaid .block{fill:none;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-sep{stroke:#526e9c;stroke-width:1.5px;stroke-dasharray:3,3;}#mermaid .block-tab{fill:#ECECFF;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-kw{font-size:14px;font-weight:bold;}#mermaid .seqnum{fill:#333;}#mermaid .seqnum-t{fill:#fff;font-size:12px;}#mermaid .title{font-size:18px;}#mermaid .box{stroke:rgba(0,0,0,0.5);stroke-width:1px;}#mermaid .destroy{stroke:#333;stroke-width:2px;fill:none;}#mermaid{fill:#000000;}#mermaid .actor{fill:#eee;}#mermaid .actor{stroke:hsl(0, 0%, 83%);}#mermaid .actor-text{fill:#333;}#mermaid .actor-line{stroke:hsl(0, 0%, 83%);}#mermaid .note{fill:#666;}#mermaid .note{stroke:#999;}#mermaid .noteText{fill:#fff;}#mermaid .labelBox{fill:#eee;}#mermaid .labelBox{stroke:hsl(0, 0%, 83%);}#mermaid .actor-man circle,#mermaid .actor-line{stroke:hsl(0, 0%, 83%);}#mermaid .actor-man circle{fill:#eee;}#mermaid .actor+text,#mermaid .actor~text{fill:#333;}#mermaid text{fill:#000000;}#mermaid .lifeline{stroke:hsl(0, 0%, 83%);}#mermaid .block,#mermaid .block-sep,#mermaid .block-tab{stroke:hsl(0, 0%, 83%);}#mermaid .block-tab{fill:#eee;}#mermaid .note+text{fill:#fff;}</style><defs><marker id="sq-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#333"/></marker><marker id="sq-arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#333"/></marker><marker id="sq-cross" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,10 M10,2 L2,10" stroke="#333" stroke-width="2"/></marker><marker id="sq-async" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs><rect x="-50" y="-10" width="550" height="444" fill="#ffffff"/><line class="lifeline" x1="75" y1="65" x2="75" y2="358"/><rect class="actor" x="0" y="0" width="150" height="65"/><text class="actor-label" x="75" y="32.5" text-anchor="middle" dominant-baseline="central">Alice</text><line class="lifeline" x1="275" y1="65" x2="275" y2="358"/><rect class="actor" x="200" y="0" width="150" height="65"/><text class="actor-label" x="275" y="32.5" text-anchor="middle" dominant-baseline="central">John</text><rect class="block" x="15" y="119" width="320" height="168"/><path class="block-tab" d="M15,119 h45.24 v14 l-8,8 H15 Z"/><text x="175" y="135" text-anchor="middle" dominant-baseline="central">[ok]</text><line class="block-sep" x1="15" y1="205" x2="335" y2="205"/><text x="175" y="219" text-anchor="middle" dominant-baseline="central">[bad]</text><text class="msg-text" x="175" y="90" text-anchor="middle" dominant-baseline="central">Hello John</text><path class="msg" d="M75,109 L274,109" marker-end="url(#sq-arrow)"/><text class="msg-text" x="175" y="176" text-anchor="middle" dominant-baseline="central">Great!</text><path class="msg dotted" d="M275,195 L76,195" marker-end="url(#sq-arrow)"/><text class="msg-text" x="175" y="258" text-anchor="middle" dominant-baseline="central">Meh</text><path class="msg dotted" d="M275,277 L76,277" marker-end="url(#sq-arrow)"/><text class="block-kw" x="23" y="130" text-anchor="start" dominant-baseline="central">alt</text><rect class="note" x="300" y="301" width="150" height="37"/><text class="note-text" x="375" y="319.5" text-anchor="middle" dominant-baseline="central">thinks</text><rect class="actor" x="0" y="358" width="150" height="65"/><text class="actor-label" x="75" y="390.5" text-anchor="middle" dominant-baseline="central">Alice</text><rect class="actor" x="200" y="358" width="150" height="65"/><text class="actor-label" x="275" y="390.5" text-anchor="middle" dominant-baseline="central">John</text></svg>
