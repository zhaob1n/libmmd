<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="sequence" width="391.8" height="478" viewBox="-20 -10 391.8 478" role="graphics-document document" aria-roledescription="sequence"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid .actor{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .actor-man circle,#mermaid .actor-line{fill:#ECECFF;stroke:#9370DB;stroke-width:2px;}#mermaid text{fill:#333;}#mermaid .lifeline{stroke:#999;stroke-width:0.5px;}#mermaid .msg{stroke:#333;stroke-width:1.5px;fill:none;}#mermaid .msg.dotted{stroke-dasharray:3,3;}#mermaid .note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#mermaid .act{fill:#f4f4f4;stroke:#666;stroke-width:1px;}#mermaid .block{fill:none;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-sep{stroke:#526e9c;stroke-width:1.5px;stroke-dasharray:3,3;}#mermaid .block-tab{fill:#ECECFF;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-kw{font-size:14px;font-weight:bold;}#mermaid .seqnum{fill:#333;}#mermaid .seqnum-t{fill:#fff;font-size:12px;}#mermaid .title{font-size:18px;}#mermaid .box{stroke:rgba(0,0,0,0.5);stroke-width:1px;}#mermaid .destroy{stroke:#333;stroke-width:2px;fill:none;}#mermaid{fill:#000000;}#mermaid .actor{fill:#eee;}#mermaid .actor{stroke:hsl(0, 0%, 83%);}#mermaid .actor-text{fill:#333;}#mermaid .actor-line{stroke:hsl(0, 0%, 83%);}#mermaid .note{fill:#666;}#mermaid .note{stroke:#999;}#mermaid .noteText{fill:#fff;}#mermaid .labelBox{fill:#eee;}#mermaid .labelBox{stroke:hsl(0, 0%, 83%);}#mermaid .actor-man circle,#mermaid .actor-line{stroke:hsl(0, 0%, 83%);}#mermaid .actor-man circle{fill:#eee;}#mermaid .actor+text,#mermaid .actor~text{fill:#333;}#mermaid text{fill:#000000;}#mermaid .lifeline{stroke:hsl(0, 0%, 83%);}#mermaid .block,#mermaid .block-sep,#mermaid .block-tab{stroke:hsl(0, 0%, 83%);}#mermaid .block-tab{fill:#eee;}#mermaid .note+text{fill:#fff;}</style><defs><marker id="sq-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHei