><text class="seqnum-t" x="475" y="871" text-anchor="middle" dominant-baseline="central">11</text><text class="msg-text" x="375" y="896" text-anchor="middle" dominant-baseline="central">websocket</text><path class="msg" d="M275,915 L474,915" marker-end="url(#sq-arrow)" marker-start="url(#sq-arrow-start)"/><circle class="seqnum" cx="275" cy="915" r="9"/><text class="seqnum-t" x="275" y="915" text-anchor="middle" dominant-baseline="central">12</text><g class="actor-man"><circle cx="75" cy="947" r="8"/><line class="actor-line" x1="75" y1="955" x2="75" y2="973"/><line class="actor-line" x1="61" y1="961" x2="89" y2="961"/><line class="actor-line" x1="75" y1="973" x2="63" y2="987"/><line class="actor-line" x1="75" y1="973" x2="87" y2="987"/></g><text class="actor-label" x="75" y="994" text-anchor="middle" dominant-baseline="central">User</text><rect class="actor" x="200" y="935" width="150" height="65"/><text class="actor-label" x="275" y="967.5" text-anchor="middle" dominant-baseline="central">Browser</text><rect class="actor" x="400" y="935" width="150" height="65"/><text class="actor-label" x="475" y="967.5" text-anchor="middle" dominant-baseline="central">Server</text><rect class="actor" x="600" y="935" width="150" height="65"/><text class="actor-label" x="675" y="967.5" text-anchor="middle" dominant-baseline="central">Database</text></svg>
