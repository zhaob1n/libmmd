<svg xmlns="http://www.w3.org/2000/svg" id="mermaid" class="sequence" width="850" height="1021" viewBox="-50 -10 850 1021" role="graphics-document document" aria-roledescription="sequence"><style>#mermaid{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid .actor{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid .actor-man circle,#mermaid .actor-line{fill:#ECECFF;stroke:#9370DB;stroke-width:2px;}#mermaid text{fill:#333;}#mermaid .lifeline{stroke:#999;stroke-width:0.5px;}#mermaid .msg{stroke:#333;stroke-width:1.5px;fill:none;}#mermaid .msg.dotted{stroke-dasharray:3,3;}#mermaid .note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#mermaid .act{fill:#f4f4f4;stroke:#666;stroke-width:1px;}#mermaid .block{fill:none;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-sep{stroke:#526e9c;stroke-width:1.5px;stroke-dasharray:3,3;}#mermaid .block-tab{fill:#ECECFF;stroke:#526e9c;stroke-width:1.5px;}#mermaid .block-kw{font-size:14px;font-weight:bold;}#mermaid .seqnum{fill:#333;}#mermaid .seqnum-t{fill:#fff;font-size:12px;}#mermaid .title{font-size:18px;}#mermaid .box{stroke:rgba(0,0,0,0.5);stroke-width:1px;}#mermaid .destroy{stroke:#333;stroke-width:2px;fill:none;}</style><defs><marker id="sq-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#333"/></marker><marker id="sq-arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#333"/></marker><marker id="sq-cross" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,10 M10,2 L2,10" stroke="#333" stroke-width="2"/></marker><marker id="sq-async" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs><rect x="-50" y="-10" width="850" height="1021" fill="white"/><text class="title" x="375" y="15" text-anchor="middle" dominant-baseline="central">Login flow</text><line class="lifeline" x1="75" y1="105" x2="75" y2="935"/><g class="actor-man"><circle cx="75" cy="52" r="8"/><line class="actor-line" x1="75" y1="60" x2="75" y2="78"/><line class="actor-line" x1="61" y1="66" x2="89" y2="66"/><line class="actor-line" x1="75" y1="78" x2="63" y2="92"/><line class="actor-line" x1="75" y1="78" x2="87" y2="92"/></g><text class="actor-label" x="75" y="99" text-anchor="middle" dominant-baseline="central">User</text><line class="lifeline" x1="275" y1="105" x2="275" y2="935"/><rect class="actor" x="200" y="40" width="150" height="65"/><text class="actor-label" x="275" y="72.5" text-anchor="middle" dominant-baseline="central">Browser</text><line class="lifeline" x1="475" y1="105" x2="475" y2="935"/><rect class="actor" x="400" y="40" width="150" height="65"/><text class="actor-label" x="475" y="72.5" text-anchor="middle" dominant-baseline="central">Server</text><line class="lifeline" x1="675" y1="105" x2="675" y2="935"/><rect class="actor" x="600" y="40" width="150" height="65"/><text class="actor-label" x="675" y="72.5" text-anchor="middle" dominant-baseline="central">Database</text><rect class="act" x="470" y="197" width="10" height="44"/><rect class="block" x="415" y="341" width="320" height="130"/><path class="block-tab" d="M415,341 h60.41 v14 l-8,8 H415 Z"/><text x="575" y="357" text-anchor="middle" dominant-baseline="central">[retry up to 3x]</text><rect class="block" x="215" y="485" width="320" height="168"/><path class="block-tab" d="M215,485 h45.24 v14 l-8,8 H215 Z"/><text x="375" y="501" text-anchor="middle" dominant-baseline="central">[valid password]</text><line class="block-sep" x1="215" y1="571" x2="535" y2="571"/><text x="375" y="585" text-anchor="middle" dominant-baseline="central">[invalid]</text><rect class="act" x="470" y="331" width="10" height="584"/><text class="msg-text" x="175" y="131" text-anchor="middle" dominant-baseline="central">open page</text><path class="msg" d="M75,151 L274,151" marker-end="url(#sq-arrow)"/><circle class="seqnum" cx="75" cy="151" r="9"/><text class="seqnum-t" x="75" y="151" text-anchor="middle" dominant-baseline="central">1</text><text class="msg-text" x="375" y="177" text-anchor="middle" dominant-baseline="central">GET /login</text><path class="msg" d="M275,197 L474,197" marker-end="url(#sq-arrow)"/><circle class="seqnum" cx="275" cy="197" r="9"/><text class="seqnum-t" x="275" y="197" text-anchor="middle" dominant-baseline="central">2</text><text class="msg-text" x="375" y="222" text-anchor="middle" dominant-baseline="central">200 OK</text><path class="msg dotted" d="M475,241 L276,241" marker-end="url(#sq-arrow)"/><circle class="seqnum" cx="475" cy="241" r="9"/><text class="seqnum-t" x="475" y="241" text-anchor="middle" dominant-baseline="central">3</text><text class="msg-text" x="175" y="266" text-anchor="middle" dominant-baseline="central">submit credentials</text><path class="msg" d="M75,285 L274,285" marker-end="url(#sq-arrow)"/><circle class="seqnum" cx="75" cy="285" r="9"/><text class="seqnum-t" x="75" y="285" text-anchor="middle" dominant-baseline="central">4</text><text class="msg-text" x="375" y="311" text-anchor="middle" dominant-baseline="central">POST /login</text><path class="msg" d="M275,331 L474,331" marker-end="url(#sq-arrow)"/><circle class="seqnum" cx="275" cy="331" r="9"/><text class="seqnum-t" x="275" y="331" text-anchor="middle" dominant-baseline="central">5</text><text class="msg-text" x="575" y="398" text-anchor="middle" dominant-baseline="central">SELECT user</text><path class="msg" d="M475,417 L674,417" marker-end="url(#sq-arrow)"/><circle class="seqnum" cx="475" cy="417" r="9"/><text class="seqnum-t" x="475" y="417" text-anchor="middle" dominant-baseline="central">6</text><text class="msg-text" x="575" y="442" text-anchor="middle"